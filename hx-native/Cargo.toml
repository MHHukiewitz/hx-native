[package]
name = "hx-native"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-process HTMX-style fragment engine for native Rust apps (offline, no JS)"
readme = "../README.md"
keywords = ["htmx", "html", "css", "ui", "offline"]
categories = ["gui", "rendering"]

[lib]
name = "hx_native"
path = "src/lib.rs"

[features]
default = []

[dependencies]
# Blitz HTML/CSS surface (pinned; no blitz-net; no wgpu in default features)
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "accessibility"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
# `svg` (issue #23): paints inline `<svg>` and SVG images through anyrender_svg.
# Nothing else: no blitz-net, no resvg. anyrender_svg's default image
# decoders (png/gif/jpeg/webp) come with it and cannot be turned off from
# here. They decode SVG `<image>` data: rasters, which src/svg.rs checks
# (type, 64 KiB, 4096x4096, trial decode) before Blitz ever sees them.
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }

# anyrender + vello_cpu path compatible with Blitz 0.3.0-beta.4 (anyrender ^0.14)
anyrender = "0.14"
anyrender_vello_cpu = "0.18"

# Same version requirements Blitz / anyrender resolve (Graph review on step 1 PR).
# Prefer types from anyrender's PaintScene API; these direct deps name Affine/Rect/Fill.
kurbo = "0.13.1"
peniko = "0.6.1"

# Already pulled by Blitz 0.3.0-beta.4; direct so we can walk shaped clusters for
# text-overflow ellipsis (issue #12) without a new unicode-segmentation crate.
# Match Blitz: no `system` feature (no fontconfig).
parley = { version = "0.12", default-features = false, features = ["std"] }

# Already pulled by Blitz 0.3.0-beta.4; direct so we can build parley TextStyle from
# computed values the same way Blitz's pub(crate) stylo_to_parley::style does.
# Bump this pin together with any Blitz bump that moves stylo — see the pin-
# sensitivity list in `src/ellipsis.rs`.
style = { package = "stylo", version = "=0.22.0" }
# Already pulled by Blitz (issue #23): direct so fragment validation can parse
# a `data:` SVG with an empty font database before it is ever swapped in.
# Bump with any Blitz bump (BLITZ_PIN.md).
usvg = { version = "=0.48.1", default-features = false }
# Already pulled by Blitz/stylo (issue #23): decodes `data:` URLs for the
# offline SVG provider.
data-url = "=0.3.2"

# Already pulled by Blitz/stylo; direct so we can clear ElementState::FOCUS for
# caret blink-off paint without snapshot_node_and (Graph HOLD #19).
style_dom = { package = "stylo_dom", version = "=0.22.0" }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"

[[test]]
name = "a8_release_timing"
path = "tests/a8_release_timing.rs"

[[test]]
name = "partial_repaint"
path = "tests/partial_repaint.rs"

[[test]]
name = "swap_damage"
path = "tests/swap_damage.rs"

[[test]]
name = "multi_surface"
path = "tests/multi_surface.rs"

[[test]]
name = "paint_worker"
path = "tests/paint_worker.rs"

[[test]]
name = "text_overflow"
path = "tests/text_overflow.rs"

[[test]]
name = "form_controls"
path = "tests/form_controls.rs"

[[test]]
name = "text_edit_controls"
path = "tests/text_edit_controls.rs"

[[example]]
name = "paint_bench"
path = "examples/paint_bench.rs"

[[example]]
name = "surface_probe"
path = "examples/surface_probe.rs"

[[example]]
name = "worker_bench"
path = "examples/worker_bench.rs"

[[example]]
name = "text_input_bench"
path = "examples/text_input_bench.rs"

[[bin]]
name = "check_deps"
path = "src/bin/check_deps.rs"
