<!DOCTYPE html><html><head><style>
html,body{margin:0;background:#008080}
.b{position:absolute;box-sizing:border-box;background:#c0c0c0;border:none;border-radius:0;padding:0;margin:0}
.panel{box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.sunk{background:#fff;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a}
.button{box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
.window{padding:3px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #fff}
.title{margin:1px;height:16px;background:#000080}
</style></head><body>
<div id="panel" class="b panel" style="left:8px;top:8px;width:56px;height:32px"></div>
<div id="sunk" class="b sunk" style="left:72px;top:8px;width:56px;height:32px"></div>
<button id="button" class="b button" style="left:136px;top:8px;width:56px;height:24px"></button>
<div id="window" class="b window" style="left:8px;top:48px;width:120px;height:64px"><div class="title"></div></div>
</body></html>
